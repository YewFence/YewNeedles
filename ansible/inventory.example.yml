# Copy this file to inventory.yml and replace the sample values.
# Defaults live in ansible/group_vars/*.yml, so this file mostly describes host
# membership and the few per-host connection details that actually vary.
# Use platform groups such as `wsl` and `pve_vms`, then capability groups such
# as `docker_enabled` and `tailscale_enabled` to avoid combinatorial group sprawl.
all:
  vars:
    username: yewfence

  children:
    servers:
      hosts:
        example_vps:
          ansible_host: 203.0.113.10
          ansible_user: root
          ansible_port: 22

    devboxes:
      children:
        wsl:
          hosts:
            example_wsl:
              ansible_connection: local
              ansible_user: yewfence

        pve_vms:
          hosts:
            example_pve_vm:
              ansible_host: 10.0.0.21
              ansible_user: yewfence
              ansible_port: 22

            example_remote_dev_vm:
              ansible_host: 203.0.113.20
              ansible_user: yewfence
              ansible_port: 22

        docker_enabled:
          hosts:
            example_pve_vm:

        tailscale_enabled:
          hosts:
            example_remote_dev_vm:
