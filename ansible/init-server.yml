---
- name: Confirm server initialization plan
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    server_init_repo_authorized_keys_file: "{{ playbook_dir }}/files/server_authorized_keys.pub"

  tasks:
    - name: Read the repository-managed SSH public keys
      ansible.builtin.set_fact:
        server_init_repo_authorized_keys_content: >-
          {{ lookup('ansible.builtin.file', server_init_repo_authorized_keys_file) }}
      changed_when: false

    - name: Fetch the sshid.io key for each server from localhost
      ansible.builtin.command:
        argv:
          - curl
          - -fsSL
          - >-
            https://sshid.io/{{
              hostvars[item].sshid_username
              | default(hostvars[item].username | default(username | default('')))
            }}
      loop: "{{ groups['servers'] | default([]) }}"
      register: server_init_sshid_fetch
      changed_when: false

    - name: Fail when sshid.io returns an empty key
      ansible.builtin.assert:
        that:
          - item.stdout | trim | length > 0
        fail_msg: >-
          sshid.io returned an empty key for
          {{
            hostvars[item.item].sshid_username
            | default(hostvars[item.item].username | default(username | default('UNSET')))
          }}.
      loop: "{{ server_init_sshid_fetch.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Build the authorized_keys payload for each server
      ansible.builtin.set_fact:
        server_init_authorized_keys_map: >-
          {{
            server_init_authorized_keys_map | default({}) |
            combine({
              item.item: (
                (
                  item.stdout.splitlines()
                  + server_init_repo_authorized_keys_content.splitlines()
                )
                | map('trim')
                | reject('equalto', '')
                | unique
                | join('\n')
              )
            })
          }}
      loop: "{{ server_init_sshid_fetch.results }}"
      changed_when: false

    - name: Fail when the combined authorized_keys payload is empty
      ansible.builtin.assert:
        that:
          - server_init_authorized_keys_map[item] | default('') | trim | length > 0
        fail_msg: "The combined authorized_keys payload is empty for {{ item }}."
      loop: "{{ groups['servers'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: Preview host settings before any remote changes
      ansible.builtin.debug:
        msg: |
          About to initialize these hosts:
          {% for host in groups['servers'] | default([]) %}
          - {{ host }}
            ansible_host: {{ hostvars[host].ansible_host | default(host) }}
            ansible_user: {{ hostvars[host].ansible_user | default('root') }}
            ansible_port: {{ hostvars[host].ansible_port | default('UNSET') }}
            username: {{ hostvars[host].username | default(username | default('UNSET')) }}
            sshid_username: {{ hostvars[host].sshid_username | default(hostvars[host].username | default(username | default('UNSET'))) }}
            enable_bbr: {{ hostvars[host].enable_bbr | default(true) }}
            enable_swap: {{ hostvars[host].enable_swap | default(true) }}
            swap_size: {{ hostvars[host].swap_size | default('UNSET') }}
            enable_ssh_hardening: {{ hostvars[host].enable_ssh_hardening | default(true) }}
            ssh_disable_password_auth: {{ hostvars[host].ssh_disable_password_auth | default(false) }}
            enable_ufw: {{ hostvars[host].enable_ufw | default(true) }}
            enable_docker: {{ hostvars[host].enable_docker | default(true) }}
            enable_tailscale: {{ hostvars[host].enable_tailscale | default(true) }}
            repo_authorized_keys_file: {{ server_init_repo_authorized_keys_file }}
            authorized_keys_preview:
          {% for key_line in server_init_authorized_keys_map[host].split('\n') %}
            - {{ key_line }}
          {% endfor %}
          {% endfor %}

    - name: Require a final yes before continuing
      ansible.builtin.pause:
        prompt: Type "yes" to continue. Any other input will cancel the run.
      register: server_init_confirmation

    - name: Abort when the operator does not confirm
      ansible.builtin.fail:
        msg: Cancelled before making changes.
      when: server_init_confirmation.user_input | lower != 'yes'

- name: Initialize Debian or Ubuntu server hosts
  hosts: servers
  serial: 1
  become: true
  gather_facts: false
  vars:
    common_authorized_keys_content: >-
      {{ hostvars['localhost'].server_init_authorized_keys_map[inventory_hostname] | default('') }}

  pre_tasks:
    # Fail before any remote changes if the required connection and user vars are
    # missing or obviously invalid.
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
          - username != 'root'
          - ansible_port is defined
          - (ansible_port | int) > 0
          - (ansible_port | int) < 65536
          - (not (enable_swap | default(true) | bool)) or (swap_size is defined)
          - (not (enable_swap | default(true) | bool)) or (swap_size | regex_search('^[0-9]+[MG]$'))
        fail_msg: >-
          Missing or invalid vars. Define username, ansible_port, and swap_size
          when swap is enabled before running this playbook.

  tasks:
    # `common` is intentionally small so it can be reused by future WSL/LXC/dev playbooks.
    - name: Apply the minimal baseline shared by most managed machines
      ansible.builtin.include_role:
        name: common

    - name: Install mise and render the global tool configuration
      ansible.builtin.include_role:
        name: mise
      when: enable_mise | default(false) | bool

    # Keep SSH auth changes isolated so password auth can be disabled in a
    # separate, explicit step after key login is verified.
    - name: Manage SSH auth hardening without forcing lockout-prone defaults
      ansible.builtin.include_role:
        name: ssh_hardening
      when: enable_ssh_hardening | default(true) | bool

    # Server-only networking tweaks stay outside `common`.
    - name: Apply BBR kernel tuning for public server hosts
      ansible.builtin.include_role:
        name: bbr
      when: enable_bbr | default(true) | bool

    # Swapfile management is separated because WSL/LXC often handle swap elsewhere.
    - name: Create and tune a swapfile when requested
      ansible.builtin.include_role:
        name: swapfile
      when: enable_swap | default(true) | bool

    # Firewall policy is server-specific, not part of the common baseline.
    - name: Configure UFW with the current SSH port and web ports
      ansible.builtin.include_role:
        name: ufw
      when: enable_ufw | default(true) | bool

    # Docker remains optional so future playbooks can omit it.
    - name: Install Docker and its daemon defaults
      ansible.builtin.include_role:
        name: docker_host
      when: enable_docker | default(true) | bool

    # Tailscale is useful for servers but should not leak into every future machine type.
    - name: Install and configure Tailscale
      ansible.builtin.include_role:
        name: tailscale
      when: enable_tailscale | default(true) | bool

  post_tasks:
    - name: Read mise version for the summary
      ansible.builtin.command: "{{ mise_managed_binary_path }} --version"
      register: mise_version
      changed_when: false
      when:
        - enable_mise | default(false) | bool

    # Collect a short end-of-run summary without assuming every optional role ran.
    - name: Read Docker version for the summary
      ansible.builtin.command: docker -v
      register: docker_version
      changed_when: false
      when: enable_docker | default(true) | bool

    - name: Read memory and swap usage for the summary
      ansible.builtin.command: free -h
      register: memory_report
      changed_when: false

    - name: Print the final summary
      ansible.builtin.debug:
        msg: |
          Initialization finished for {{ inventory_hostname }}.
          Enabled roles:
            common: true
            ssh_hardening: {{ enable_ssh_hardening | default(true) | bool }}
            bbr: {{ enable_bbr | default(true) | bool }}
            swapfile: {{ enable_swap | default(true) | bool }}
            ufw: {{ enable_ufw | default(true) | bool }}
            docker_host: {{ enable_docker | default(true) | bool }}
            tailscale: {{ enable_tailscale | default(true) | bool }}
            mise: {{ enable_mise | default(false) | bool }}
          PasswordAuthentication disabled: {{ ssh_disable_password_auth | default(false) | bool }}
          {% if enable_docker | default(true) | bool %}

          Docker version: {{ docker_version.stdout }}
          {% endif %}

          Memory report:
          {{ memory_report.stdout }}
          {% if enable_mise | default(false) | bool and mise_version is defined %}

          Mise version:
          {{ mise_version.stdout_lines | join('\n') }}
          {% endif %}
          {% if common_user_created | default(false) %}

          Temporary password for {{ username }}: {{ common_generated_password }}
          Save it now if you still need sudo over password auth.
          {% else %}

          {{ username }} already existed, so its password was not changed.
          {% endif %}
