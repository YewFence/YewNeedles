---
- name: Confirm server initialization plan
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Prepare SSH key management inputs on localhost
      ansible.builtin.include_role:
        name: ssh_key_management
        tasks_from: prepare
        public: true

    - name: Build preview lines for each host
      ansible.builtin.set_fact:
        _preview_lines: >-
          {{ _preview_lines | default(['About to initialize these server hosts:'])
             + ['',
                '  Host : ' + _h,
                '  ' + ('─' * 40),
                '  ansible_host       : ' + (hostvars[_h].ansible_host | default(_h) | string),
                '  ansible_user       : ' + (hostvars[_h].ansible_user | default('root') | string),
                '  ansible_port       : ' + (hostvars[_h].ansible_port | default('UNSET') | string),
                '  username           : ' + (hostvars[_h].username | default(username | default('UNSET')) | string),
                '  sshid_username     : ' + (hostvars[_h].sshid_username | default(hostvars[_h].username | default(username | default('UNSET'))) | string),
                '',
                '  Features',
                '    ssh_key_management: ' + (hostvars[_h].enable_ssh_key_management | default(true) | string),
                '    ssh_hardening     : ' + (hostvars[_h].enable_ssh_hardening | default(true) | string),
                '    ssh_disable_pw    : ' + (hostvars[_h].ssh_disable_password_auth | default(false) | string),
                '    bbr               : ' + (hostvars[_h].enable_bbr | default(true) | string),
                '    swap              : ' + (hostvars[_h].enable_swap | default(true) | string),
                '    swap_size         : ' + (hostvars[_h].swap_size | default('UNSET') | string),
                '    ufw               : ' + (hostvars[_h].enable_ufw | default(true) | string),
                '    docker            : ' + (hostvars[_h].enable_docker | default(true) | string),
                '    tailscale         : ' + (hostvars[_h].enable_tailscale | default(true) | string),
                '    komodo_agent      : ' + (hostvars[_h].enable_komodo_agent | default(false) | string),
                '    komodo_state      : ' + (hostvars[_h].komodo_agent_state | default('present') | string),
                '    komodo_core       : ' + (hostvars[_h].komodo_agent_core_address | default('UNSET') | string),
                '    zsh               : ' + (hostvars[_h].enable_zsh | default(true) | string),
                '    mise              : ' + (hostvars[_h].enable_mise | default(true) | string)]
             + (
               ['',
                '  Authorized Keys (sshid.io + ' + ssh_key_management_repo_authorized_keys_file + ')']
               + (ssh_key_management_authorized_keys_map[_h].split('\n') | map('regex_replace', '^', '    ') | list)
               if (hostvars[_h].enable_ssh_key_management | default(true) | bool)
               else ['',
                     '  Authorized Keys',
                     '    Managed externally or disabled in this repo.']
             ) }}
      loop: "{{ groups['servers'] | default([]) }}"
      loop_control:
        loop_var: _h

    - name: Preview host settings before any remote changes
      ansible.builtin.debug:
        msg: "{{ _preview_lines }}"

    - name: Require a final yes before continuing
      ansible.builtin.pause:
        prompt: Type "yes" to continue. Any other input will cancel the run.
      register: server_init_confirmation

    - name: Abort when the operator does not confirm
      ansible.builtin.fail:
        msg: Cancelled before making changes.
      when: server_init_confirmation.user_input | lower != 'yes'

- name: Initialize Debian or Ubuntu server hosts
  hosts: servers
  serial: 1
  become: true
  gather_facts: false
  vars:
    common_create_temp_password: true
    ssh_key_management_authorized_keys_content: >-
      {{ hostvars['localhost'].ssh_key_management_authorized_keys_map[inventory_hostname] | default('') }}

  pre_tasks:
    # Fail before any remote changes if the required connection and user vars are
    # missing or obviously invalid.
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
          - username != 'root'
          - ansible_port is defined
          - (ansible_port | int) > 0
          - (ansible_port | int) < 65536
          - (not (enable_swap | default(true) | bool)) or (swap_size is defined)
          - (not (enable_swap | default(true) | bool)) or (swap_size is match('^[0-9]+[MG]$'))
        fail_msg: >-
          Missing or invalid vars. Define username, ansible_port, and swap_size
          when swap is enabled before running this playbook.

  tasks:
    # `common` is intentionally small so it can be reused by future WSL/LXC/dev playbooks.
    - name: Apply the minimal baseline shared by most managed machines
      ansible.builtin.include_role:
        name: common

    - name: Manage authorized_keys for hosts that opt into repository SSH key management
      ansible.builtin.include_role:
        name: ssh_key_management
      when: enable_ssh_key_management | default(true) | bool

    - name: Install zsh with lightweight completion and plugins
      ansible.builtin.include_role:
        name: zsh
      when: enable_zsh | default(true) | bool

    - name: Install mise and render the global tool configuration
      ansible.builtin.include_role:
        name: mise
      when: enable_mise | default(true) | bool

    # Keep SSH auth changes isolated so password auth can be disabled in a
    # separate, explicit step after key login is verified.
    - name: Manage SSH auth hardening without forcing lockout-prone defaults
      ansible.builtin.include_role:
        name: ssh_hardening
      when: enable_ssh_hardening | default(true) | bool

    # Server-only networking tweaks stay outside `common`.
    - name: Apply BBR kernel tuning for public server hosts
      ansible.builtin.include_role:
        name: bbr
      when: enable_bbr | default(true) | bool

    # Swapfile management is separated because WSL/LXC often handle swap elsewhere.
    - name: Create and tune a swapfile when requested
      ansible.builtin.include_role:
        name: swapfile
      when: enable_swap | default(true) | bool

    # Firewall policy is server-specific, not part of the common baseline.
    - name: Configure UFW with the current SSH port and web ports
      ansible.builtin.include_role:
        name: ufw
      when: enable_ufw | default(true) | bool

    # Docker remains optional so future playbooks can omit it.
    - name: Install Docker and its daemon defaults
      ansible.builtin.include_role:
        name: docker_host
      when: enable_docker | default(true) | bool

    # Tailscale is useful for servers but should not leak into every future machine type.
    - name: Install and configure Tailscale
      ansible.builtin.include_role:
        name: tailscale
      when: enable_tailscale | default(true) | bool

    - name: Render shell initialization, aliases, and completions
      ansible.builtin.include_role:
        name: shell_init
      vars:
        shell_init_enable_mise: "{{ enable_mise | default(true) | bool }}"
        shell_init_enable_tailscale: "{{ enable_tailscale | default(true) | bool }}"
      when:
        - enable_mise | default(true) | bool
          or enable_tailscale | default(true) | bool

    - name: Deploy Komodo Periphery with Docker Compose
      ansible.builtin.include_role:
        name: komodo_agent
      when: enable_komodo_agent | default(false) | bool

  post_tasks:
    - name: Read mise version for the summary
      ansible.builtin.command: "{{ mise_managed_binary_path }} --version"
      register: mise_version
      changed_when: false
      when:
        - enable_mise | default(true) | bool

    # Collect a short end-of-run summary without assuming every optional role ran.
    - name: Read Docker version for the summary
      ansible.builtin.command: docker -v
      register: docker_version
      changed_when: false
      when: enable_docker | default(true) | bool

    - name: Read memory and swap usage for the summary
      ansible.builtin.command: free -h
      register: memory_report
      changed_when: false

    - name: Print the final summary
      ansible.builtin.debug:
        msg: |
          Initialization finished for {{ inventory_hostname }}.
          Enabled roles:
            common: true
            ssh_key_management: {{ enable_ssh_key_management | default(true) | bool }}
            ssh_hardening: {{ enable_ssh_hardening | default(true) | bool }}
            bbr: {{ enable_bbr | default(true) | bool }}
            swapfile: {{ enable_swap | default(true) | bool }}
            ufw: {{ enable_ufw | default(true) | bool }}
            docker_host: {{ enable_docker | default(true) | bool }}
            tailscale: {{ enable_tailscale | default(true) | bool }}
            komodo_agent: {{ enable_komodo_agent | default(false) | bool }}
            zsh: {{ enable_zsh | default(true) | bool }}
            mise: {{ enable_mise | default(true) | bool }}
          SSH port: {{ ansible_port }}
          sshid.io user: {{ sshid_username | default(username) if (enable_ssh_key_management | default(true) | bool) else 'disabled' }}
          PasswordAuthentication disabled: {{ ssh_disable_password_auth | default(false) | bool }}
          {% if enable_docker | default(true) | bool %}

          Docker version: {{ docker_version.stdout }}
          {% endif %}

          Memory report:
          {{ memory_report.stdout }}
          {% if enable_mise | default(true) | bool and mise_version is defined %}

          Mise version:
          {{ mise_version.stdout_lines | join('\n') }}
          {% endif %}
          {% if common_user_created | default(false) %}

          Temporary password for {{ username }}: {{ common_generated_password }}
          Save it now if you still need sudo over password auth.
          {% else %}

          {{ username }} already existed, so its password was not changed.
          {% endif %}
