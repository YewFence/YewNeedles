---
- name: Initialize Debian or Ubuntu server hosts
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    # Fail before any remote changes if the required connection and user vars are
    # missing or obviously invalid.
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
          - username != 'root'
          - sshid_username is defined
          - sshid_username | length > 0
          - ansible_port is defined
          - (ansible_port | int) > 0
          - (ansible_port | int) < 65536
          - (not (enable_swap | default(true) | bool)) or (swap_size is defined)
          - (not (enable_swap | default(true) | bool)) or (swap_size | regex_search('^[0-9]+[MG]$'))
        fail_msg: >-
          Missing or invalid vars. Define username, sshid_username, ansible_port,
          and swap_size when swap is enabled before running this playbook.

    # Show a single summary of the host values and enabled roles before anything runs.
    - name: Preview host settings before any remote changes
      ansible.builtin.debug:
        msg: |
          About to initialize these hosts:
          {% for host in ansible_play_hosts_all %}
          - {{ host }}
            ansible_host: {{ hostvars[host].ansible_host | default(host) }}
            ansible_user: {{ hostvars[host].ansible_user | default('root') }}
            ansible_port: {{ hostvars[host].ansible_port | default('UNSET') }}
            username: {{ hostvars[host].username | default('UNSET') }}
            sshid_username: {{ hostvars[host].sshid_username | default('UNSET') }}
            enable_bbr: {{ hostvars[host].enable_bbr | default(true) }}
            enable_swap: {{ hostvars[host].enable_swap | default(true) }}
            swap_size: {{ hostvars[host].swap_size | default('UNSET') }}
            enable_ufw: {{ hostvars[host].enable_ufw | default(true) }}
            enable_docker: {{ hostvars[host].enable_docker | default(true) }}
            enable_tailscale: {{ hostvars[host].enable_tailscale | default(true) }}
          {% endfor %}
      run_once: true
      delegate_to: localhost

    # Preserve the current workflow: ask once, then either continue or abort.
    - name: Require a final yes before continuing
      ansible.builtin.pause:
        prompt: Type "yes" to continue. Any other input will cancel the run.
      register: init_confirmation
      run_once: true
      delegate_to: localhost

    - name: Abort when the operator does not confirm
      ansible.builtin.fail:
        msg: Cancelled before making changes.
      when: init_confirmation.user_input | lower != 'yes'
      run_once: true
      delegate_to: localhost

  tasks:
    # `common` is intentionally small so it can be reused by future WSL/LXC/dev playbooks.
    - name: Apply the minimal baseline shared by most managed machines
      ansible.builtin.include_role:
        name: common

    # Server-only networking tweaks stay outside `common`.
    - name: Apply BBR kernel tuning for public server hosts
      ansible.builtin.include_role:
        name: bbr
      when: enable_bbr | default(true) | bool

    # Swapfile management is separated because WSL/LXC often handle swap elsewhere.
    - name: Create and tune a swapfile when requested
      ansible.builtin.include_role:
        name: swapfile
      when: enable_swap | default(true) | bool

    # Firewall policy is server-specific, not part of the common baseline.
    - name: Configure UFW with the current SSH port and web ports
      ansible.builtin.include_role:
        name: ufw
      when: enable_ufw | default(true) | bool

    # Docker remains optional so future playbooks can omit it.
    - name: Install Docker and its daemon defaults
      ansible.builtin.include_role:
        name: docker_host
      when: enable_docker | default(true) | bool

    # Tailscale is useful for servers but should not leak into every future machine type.
    - name: Install and configure Tailscale
      ansible.builtin.include_role:
        name: tailscale
      when: enable_tailscale | default(true) | bool

  post_tasks:
    # Collect a short end-of-run summary without assuming every optional role ran.
    - name: Read Docker version for the summary
      ansible.builtin.command: docker -v
      register: docker_version
      changed_when: false
      when: enable_docker | default(true) | bool

    - name: Read memory and swap usage for the summary
      ansible.builtin.command: free -h
      register: memory_report
      changed_when: false

    - name: Print the final summary
      ansible.builtin.debug:
        msg: |
          Initialization finished for {{ inventory_hostname }}.
          Enabled roles:
            common: true
            bbr: {{ enable_bbr | default(true) | bool }}
            swapfile: {{ enable_swap | default(true) | bool }}
            ufw: {{ enable_ufw | default(true) | bool }}
            docker_host: {{ enable_docker | default(true) | bool }}
            tailscale: {{ enable_tailscale | default(true) | bool }}
          {% if enable_docker | default(true) | bool %}

          Docker version: {{ docker_version.stdout }}
          {% endif %}

          Memory report:
          {{ memory_report.stdout }}
          {% if common_user_created | default(false) %}

          Temporary password for {{ username }}: {{ common_generated_password }}
          Save it now if you still need sudo over password auth.
          {% else %}

          {{ username }} already existed, so its password was not changed.
          {% endif %}
