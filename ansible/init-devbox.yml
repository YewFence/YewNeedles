---
- name: Confirm development initialization plan
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build preview lines for each host
      ansible.builtin.set_fact:
        _preview_lines: >-
          {{ _preview_lines | default(['About to initialize these development hosts:'])
             + ['',
                '  Host : ' + _h,
                '  ' + ('─' * 40),
                '  ansible_connection : ' + (hostvars[_h].ansible_connection | default('ssh') | string),
                '  ansible_host       : ' + (hostvars[_h].ansible_host | default(_h) | string),
                '  ansible_user       : ' + (hostvars[_h].ansible_user | default(username | default('UNSET')) | string),
                '  username           : ' + (hostvars[_h].username | default(username | default('UNSET')) | string),
                '',
                '  Network',
                '    manage       : ' + (hostvars[_h].devbox_network_manage | default(false) | string),
                '    preset       : ' + (hostvars[_h].devbox_network_preset | default('disabled') | string),
                '    backend      : ' + (hostvars[_h].devbox_network_backend | default('disabled') | string),
                '    interface    : ' + (hostvars[_h].devbox_network_interface | default('auto', true) | string),
                '    gateway      : ' + (hostvars[_h].devbox_network_gateway | default('UNSET') | string),
                '    dns_servers  : ' + (hostvars[_h].devbox_network_dns_servers | default([]) | join(', ') | string),
                '    static_ipv4  : ' + (hostvars[_h].devbox_network_static_ipv4 | default('auto/current', true) | string),
                '',
                '  Features',
                '    qemu_guest_agent : ' + (hostvars[_h].dev_enable_qemu_guest_agent | default(false) | string),
                '    oh_my_zsh  : ' + (hostvars[_h].dev_enable_oh_my_zsh | default(true) | string),
                '    mise       : ' + (hostvars[_h].enable_mise | default(true) | string),
                '    zellij     : ' + (hostvars[_h].dev_enable_zellij | default(true) | string),
                '    docker     : ' + (hostvars[_h].dev_enable_docker | default(false) | string),
                '    tailscale  : ' + (hostvars[_h].dev_enable_tailscale | default(false) | string),
                '    agent_sw   : ' + (hostvars[_h].dev_enable_agent_software | default(false) | string)] }}
      loop: "{{ groups['devboxes'] | default([]) }}"
      loop_control:
        loop_var: _h

    - name: Preview host settings before any local or remote changes
      ansible.builtin.debug:
        msg: "{{ _preview_lines }}"

    - name: Require a final yes before continuing
      ansible.builtin.pause:
        prompt: Type "yes" to continue. Any other input will cancel the run.
      register: devbox_init_confirmation

    - name: Abort when the operator does not confirm
      ansible.builtin.fail:
        msg: Cancelled before making changes.
      when: devbox_init_confirmation.user_input | lower != 'yes'

- name: Initialize Debian or Ubuntu development hosts
  hosts: devboxes
  serial: 1
  become: true
  gather_facts: false

  vars:
    common_manage_root_ssh_key: false
    common_copy_root_authorized_keys: false
    common_create_temp_password: false

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
          - username != 'root'
        fail_msg: Define a non-root username before running the devbox playbook.

  tasks:
    - name: Apply devbox-specific network overrides before package work
      ansible.builtin.include_role:
        name: devbox_network
      when: devbox_network_manage | default(false) | bool

    - name: Apply the shared baseline used by both servers and devboxes
      ansible.builtin.include_role:
        name: common

    - name: Install and start qemu-guest-agent on Proxmox VMs
      ansible.builtin.include_role:
        name: qemu_guest_agent
      when: dev_enable_qemu_guest_agent | default(false) | bool

    - name: Install and configure Oh My Zsh for the managed user
      ansible.builtin.include_role:
        name: oh_my_zsh
      when: dev_enable_oh_my_zsh | default(true) | bool

    - name: Install mise and render the global tool configuration
      ansible.builtin.include_role:
        name: mise
      when: enable_mise | default(true) | bool

    - name: Initialize shell integrations for mise-managed tools
      ansible.builtin.include_role:
        name: shell_init
      when: enable_mise | default(true) | bool

    - name: Install and configure zellij for interactive shells
      ansible.builtin.include_role:
        name: zellij
      when: dev_enable_zellij | default(true) | bool

    - name: Install Docker on development hosts that need container workloads
      ansible.builtin.include_role:
        name: docker_host
      when: dev_enable_docker | default(false) | bool

    - name: Install and configure Tailscale on development hosts that need overlay access
      ansible.builtin.include_role:
        name: tailscale
      when: dev_enable_tailscale | default(false) | bool

    - name: Install agent software (claude-code, codex, cc-switch) and configure WebDAV sync
      ansible.builtin.include_role:
        name: agent_software
      when: dev_enable_agent_software | default(false) | bool

    - name: Configure shell aliases for installed tools
      ansible.builtin.include_role:
        name: shell_aliases

  post_tasks:
    - name: Read mise version for the summary
      ansible.builtin.command: "{{ mise_managed_binary_path }} --version"
      register: mise_version
      changed_when: false
      when:
        - enable_mise | default(true) | bool

    - name: Read Docker version for the summary
      ansible.builtin.command: docker -v
      register: docker_version
      changed_when: false
      when: dev_enable_docker | default(false) | bool

    - name: Print the final summary
      ansible.builtin.debug:
        msg: |
          Development initialization finished for {{ inventory_hostname }}.
          Enabled roles:
            devbox_network: {{ devbox_network_manage | default(false) | bool }}
            common: true
            qemu_guest_agent: {{ dev_enable_qemu_guest_agent | default(false) | bool }}
            oh_my_zsh: {{ dev_enable_oh_my_zsh | default(true) | bool }}
            mise: {{ enable_mise | default(true) | bool }}
            zellij: {{ dev_enable_zellij | default(true) | bool }}
            docker_host: {{ dev_enable_docker | default(false) | bool }}
            tailscale: {{ dev_enable_tailscale | default(false) | bool }}
            agent_software: {{ dev_enable_agent_software | default(false) | bool }}
          Network preset: {{ devbox_network_preset | default('disabled') }}
          Configured backend: {{ devbox_network_backend | default('disabled') }}
          Network backend: {{ devbox_network_applied_backend | default('disabled') }}
          Configured interface override: {{ devbox_network_interface | default('') | default('auto', true) }}
          Selected interface: {{ devbox_network_selected_interface | default('unknown') }}
          NetworkManager connection: {{ devbox_network_selected_connection_name | default('unknown') }}
          Original connect host: {{ devbox_network_original_ansible_host | default('unknown') }}
          Reconnect target: {{ devbox_network_reconnect_target | default('unchanged') | default('unchanged', true) }}
          Inventory update needed: {{ devbox_network_inventory_update_needed | default(false) | bool }}
          Configured static IPv4: {{ devbox_network_static_ipv4 | default('') | default('auto/current', true) }}
          Configured default gateway: {{ devbox_network_gateway | default('unchanged') }}
          Effective default gateway: {{ devbox_network_effective_gateway | default('unknown') | default('unknown', true) }}
          Effective default route: {{ devbox_network_effective_default_route | default('unknown') | default('unknown', true) }}
          DNS servers: {{ devbox_network_dns_servers | default([]) | join(', ') }}
          Gateway persistence confirmed: {{ devbox_network_gateway_persistent | default(false) | bool }}
          {% if devbox_network_inventory_update_needed | default(false) | bool %}

          WARNING: update ansible_host in inventory from
          {{ devbox_network_original_ansible_host }} to
          {{ devbox_network_reconnect_target }}.
          {% endif %}
          {% if enable_mise | default(true) | bool and mise_version is defined %}

          Mise version:
          {{ mise_version.stdout_lines | join('\n') }}
          {% endif %}
          {% if dev_enable_docker | default(false) | bool and docker_version is defined %}

          Docker version: {{ docker_version.stdout }}
          {% endif %}
