---
# Canonical role toggles use `enable_*` even on devboxes so shared capabilities
# match the server playbook. Legacy `dev_enable_*` inventory keys still feed
# these vars until the inventory is fully migrated.
enable_mise: "{{ dev_enable_mise | default(true) }}"
enable_zellij: "{{ dev_enable_zellij | default(true) }}"
enable_docker: "{{ dev_enable_docker | default(false) }}"
enable_tailscale: "{{ dev_enable_tailscale | default(false) }}"
enable_agent_software: "{{ dev_enable_agent_software | default(false) }}"

# Keep the `dev_enable_*` prefix for devbox-only features.
dev_enable_oh_my_zsh: true

mise_enable_dev_tools: true
mise_tools_dev:
  "zellij": latest
  "gh": latest
  "github:Apts-1547/gcop-rs": latest
  "github:YewFence/ssh-config-manager": latest
  "uv": latest
  "node": lts
  "lazygit": latest
devbox_network_manage: false
devbox_network_preset: disabled
devbox_network_backend: disabled
devbox_network_interface: ""
devbox_network_gateway: ""
devbox_network_dns_servers: []
devbox_network_static_ipv4: ""
