---
# The authorized_keys payload is prepared on localhost so the operator can
# confirm the exact keys before anything on the server is overwritten.
- name: Ensure root SSH directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: "0700"
  when: ssh_key_management_manage_root_authorized_keys | bool

- name: Normalize the prepared authorized_keys content
  ansible.builtin.set_fact:
    ssh_key_management_authorized_keys_normalized_content: >-
      {{
        ssh_key_management_authorized_keys_content
        | replace('\\n', '\n')
      }}
  changed_when: false
  when:
    - ssh_key_management_manage_root_authorized_keys | bool
      or ssh_key_management_copy_authorized_keys_to_user | bool

- name: Require prepared authorized_keys content when SSH keys are managed
  ansible.builtin.assert:
    that:
      - ssh_key_management_authorized_keys_normalized_content | trim | length > 0
    fail_msg: >-
      Provide ssh_key_management_authorized_keys_content before managing
      authorized_keys.
  when:
    - ssh_key_management_manage_root_authorized_keys | bool
      or ssh_key_management_copy_authorized_keys_to_user | bool

- name: Overwrite root authorized_keys with the prepared keys
  ansible.builtin.copy:
    dest: /root/.ssh/authorized_keys
    mode: "0600"
    content: "{{ ssh_key_management_authorized_keys_normalized_content | trim ~ '\n' }}"
  when: ssh_key_management_manage_root_authorized_keys | bool

- name: Ensure the managed user SSH directory exists
  ansible.builtin.file:
    path: /home/{{ username }}/.ssh
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"
  when:
    - ssh_key_management_manage_user | bool
    - ssh_key_management_copy_authorized_keys_to_user | bool

- name: Overwrite the managed user authorized_keys with the prepared keys
  ansible.builtin.copy:
    dest: /home/{{ username }}/.ssh/authorized_keys
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
    content: "{{ ssh_key_management_authorized_keys_normalized_content | trim ~ '\n' }}"
  when:
    - ssh_key_management_manage_user | bool
    - ssh_key_management_copy_authorized_keys_to_user | bool
