---
- name: Require prepared authorized_keys content when SSH keys are managed
  ansible.builtin.assert:
    that:
      - ssh_key_management_authorized_keys_content | trim | length > 0
    fail_msg: >-
      Provide ssh_key_management_authorized_keys_content before managing
      authorized_keys.
  when:
    - ssh_key_management_manage_root_authorized_keys | bool
      or ssh_key_management_copy_authorized_keys_to_user | bool

- name: Manage root authorized_keys with the prepared keys
  ansible.posix.authorized_key:
    user: root
    key: "{{ ssh_key_management_authorized_keys_content | trim }}"
    state: present
    exclusive: true
    manage_dir: true
  when: ssh_key_management_manage_root_authorized_keys | bool

- name: Enforce root authorized_keys permissions
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0600"
  when: ssh_key_management_manage_root_authorized_keys | bool

- name: Ensure the managed user SSH directory permissions stay strict
  ansible.builtin.file:
    path: /home/{{ username }}/.ssh
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0700"
  when:
    - ssh_key_management_manage_user | bool
    - ssh_key_management_copy_authorized_keys_to_user | bool

- name: Manage the target user authorized_keys with the prepared keys
  ansible.posix.authorized_key:
    user: "{{ username }}"
    key: "{{ ssh_key_management_authorized_keys_content | trim }}"
    state: present
    exclusive: true
    manage_dir: false
  when:
    - ssh_key_management_manage_user | bool
    - ssh_key_management_copy_authorized_keys_to_user | bool

- name: Enforce the target user authorized_keys permissions
  ansible.builtin.file:
    path: /home/{{ username }}/.ssh/authorized_keys
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
  when:
    - ssh_key_management_manage_user | bool
    - ssh_key_management_copy_authorized_keys_to_user | bool
