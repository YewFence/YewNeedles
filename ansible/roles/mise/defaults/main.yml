---
mise_install_script_url: https://mise.run
mise_install_script_dest: /tmp/mise-install.sh
mise_binary_path: /home/{{ username }}/.local/bin/mise
mise_config_dir: /home/{{ username }}/.config/mise
mise_config_file: "{{ mise_config_dir }}/config.toml"
mise_shell_activation_targets:
  - path: /home/{{ username }}/.bashrc
    shell: bash
  - path: /home/{{ username }}/.zshrc
    shell: zsh
mise_tools_base: {}
mise_tools_dev: {}
mise_tools_server: {}
mise_enable_dev_tools: false
mise_enable_server_tools: false
mise_tools_extra: {}
mise_tools: >-
  {{
    mise_tools_base
    | combine((mise_tools_dev if mise_enable_dev_tools | bool else {}), recursive=True)
    | combine((mise_tools_server if mise_enable_server_tools | bool else {}), recursive=True)
    | combine(mise_tools_extra, recursive=True)
  }}
