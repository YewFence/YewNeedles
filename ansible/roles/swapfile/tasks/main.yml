---
# Only create a swapfile when the host does not already have active swap.
- name: Check whether swap is already active
  ansible.builtin.command: swapon --show --noheadings
  register: swapfile_active_swap
  changed_when: false

- name: Create and enable a swapfile when swap is missing
  when: swapfile_active_swap.stdout | trim == ''
  block:
    - name: Allocate the swapfile
      ansible.builtin.command: fallocate -l {{ swap_size }} {{ swapfile_path }}
      args:
        creates: "{{ swapfile_path }}"

    - name: Lock down swapfile permissions
      ansible.builtin.file:
        path: "{{ swapfile_path }}"
        mode: "0600"
        owner: root
        group: root

    - name: Format the swapfile
      ansible.builtin.command: mkswap {{ swapfile_path }}

    - name: Enable the swapfile now
      ansible.builtin.command: swapon {{ swapfile_path }}

    - name: Persist the swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ swapfile_path }} none swap sw 0 0"
        state: present

# Keep the swap tuning next to the swapfile role instead of mixing it into
# unrelated kernel/network tuning.
- name: Install swap tuning sysctl settings
  ansible.builtin.copy:
    dest: "{{ swapfile_sysctl_file }}"
    mode: "0644"
    content: |
      vm.swappiness = {{ swapfile_swappiness }}
  notify: Reload swap sysctl
