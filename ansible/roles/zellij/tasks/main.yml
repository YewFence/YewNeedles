- name: Install the zellij autostart block
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    marker: "# {mark} YewNeedles Zellij"
    block: "{{ zellij_autostart_block }}"
  loop: "{{ zellij_shell_rc_files }}"
