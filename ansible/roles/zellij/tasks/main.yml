---
- name: Probe known Homebrew install locations for zellij
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/linuxbrew/.linuxbrew/bin/brew
    - /home/{{ username }}/.linuxbrew/bin/brew
  register: zellij_homebrew_candidate_stats
  when: homebrew_brew_bin is not defined

- name: Record the Homebrew binary path for zellij
  ansible.builtin.set_fact:
    homebrew_brew_bin: >-
      {{
        (
          zellij_homebrew_candidate_stats.results
          | selectattr('stat.exists')
          | map(attribute='stat.path')
          | list
          | first
        ) | default('')
      }}
  changed_when: false
  when: homebrew_brew_bin is not defined

- name: Require Homebrew before installing zellij packages
  ansible.builtin.assert:
    that:
      - homebrew_brew_bin is defined
      - homebrew_brew_bin | length > 0
    fail_msg: Homebrew must be installed before the zellij role can run.

- name: Check whether requested zellij packages are already installed
  ansible.builtin.command: "{{ homebrew_brew_bin }} list --versions {{ item }}"
  environment:
    HOME: /home/{{ username }}
    HOMEBREW_NO_ENV_HINTS: "1"
  become_user: "{{ username }}"
  register: zellij_package_status
  changed_when: false
  failed_when: false
  loop: "{{ zellij_packages }}"

- name: Install missing zellij packages
  ansible.builtin.command: "{{ homebrew_brew_bin }} install {{ item.item }}"
  environment:
    HOME: /home/{{ username }}
    HOMEBREW_NO_ENV_HINTS: "1"
  become_user: "{{ username }}"
  loop: "{{ zellij_package_status.results }}"
  when: item.rc != 0

- name: Install the zellij autostart block
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    marker: "# {mark} YewNeedles Zellij"
    block: "{{ zellij_autostart_block }}"
  loop: "{{ zellij_shell_rc_files }}"
