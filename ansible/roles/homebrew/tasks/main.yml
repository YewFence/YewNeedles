---
- name: Install Homebrew build dependencies
  ansible.builtin.apt:
    name: "{{ homebrew_apt_packages }}"
    state: present
    update_cache: true

- name: Probe known Homebrew install locations
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/linuxbrew/.linuxbrew/bin/brew
    - /home/{{ username }}/.linuxbrew/bin/brew
  register: homebrew_candidate_stats

- name: Record the current Homebrew binary path when already installed
  ansible.builtin.set_fact:
    homebrew_brew_bin: >-
      {{
        (
          homebrew_candidate_stats.results
          | selectattr('stat.exists')
          | map(attribute='stat.path')
          | list
          | first
        ) | default('')
      }}
  changed_when: false

- name: Install Homebrew for the managed user
  ansible.builtin.get_url:
    url: "{{ homebrew_install_script_url }}"
    dest: /tmp/homebrew-install.sh
    mode: "0755"
  when: homebrew_brew_bin == ''

- name: Run the Homebrew installer for the managed user
  ansible.builtin.command:
    argv:
      - /bin/bash
      - /tmp/homebrew-install.sh
  environment:
    CI: "1"
    NONINTERACTIVE: "1"
    HOME: /home/{{ username }}
  become: true
  become_user: "{{ username }}"
  changed_when: true
  when: homebrew_brew_bin == ''

- name: Probe Homebrew install locations again after installation
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/linuxbrew/.linuxbrew/bin/brew
    - /home/{{ username }}/.linuxbrew/bin/brew
  register: homebrew_candidate_stats_after

- name: Record the Homebrew binary path after installation
  ansible.builtin.set_fact:
    homebrew_brew_bin: >-
      {{
        (
          homebrew_candidate_stats_after.results
          | selectattr('stat.exists')
          | map(attribute='stat.path')
          | list
          | first
        ) | default(homebrew_brew_bin)
      }}
  changed_when: false

- name: Fail when Homebrew still cannot be found
  ansible.builtin.assert:
    that:
      - homebrew_brew_bin | length > 0
    fail_msg: >-
      Homebrew install finished but no brew binary was found in the known Linux
      prefixes. Check the install output and update this role if your target
      image uses a different path.

- name: Install Homebrew shellenv blocks
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    create: true
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    marker: "# {mark} YewNeedles Homebrew"
    block: "{{ homebrew_shellenv_block }}"
  loop: "{{ homebrew_shell_rc_files }}"

- name: Check whether requested Homebrew packages are already installed
  ansible.builtin.command:
    argv:
      - "{{ homebrew_brew_bin }}"
      - list
      - --versions
      - "{{ item }}"
  environment:
    HOME: /home/{{ username }}
    HOMEBREW_NO_ENV_HINTS: "1"
  become: true
  become_user: "{{ username }}"
  register: homebrew_package_status
  changed_when: false
  failed_when: false
  loop: "{{ homebrew_packages }}"

- name: Install missing Homebrew packages
  ansible.builtin.command:
    argv:
      - "{{ homebrew_brew_bin }}"
      - install
      - "{{ item.item }}"
  environment:
    HOME: /home/{{ username }}
    HOMEBREW_NO_ENV_HINTS: "1"
  become: true
  become_user: "{{ username }}"
  changed_when: true
  loop: "{{ homebrew_package_status.results }}"
  when: item.rc != 0
