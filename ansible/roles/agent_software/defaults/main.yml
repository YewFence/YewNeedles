---
agent_software_mise_binary_path: /home/{{ username }}/.local/bin/mise

# Tools to install via mise
agent_software_mise_tools:
  "codex": "latest"
  "claude-code": "latest"
  "github:SaladDay/cc-switch-cli": "latest"

# cc-switch WebDAV configuration
# These should be set via ansible-vault encrypted vars
agent_software_cc_switch_webdav_base_url: ""
agent_software_cc_switch_webdav_username: ""
agent_software_cc_switch_webdav_password: ""

# cc-switch tool spec for mise exec (avoids shim resolution issues with github: backend)
agent_software_cc_switch_tool_spec: "github:SaladDay/cc-switch-cli"
