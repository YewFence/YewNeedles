---
# Keep the current convenience-script install path, but isolate it from the shared baseline.
- name: Check whether Docker is already installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_host_binary

- name: Install Docker via the official convenience script
  ansible.builtin.shell: curl -fsSL {{ docker_install_script_url }} | sh
  args:
    executable: /bin/bash
  when: not docker_host_binary.stat.exists

- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present

# Add the managed user to the docker group only when this server-oriented role is enabled.
- name: Ensure the managed user belongs to the docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - docker
    append: true
  when: docker_manage_user_group | bool

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Install Docker daemon log rotation config
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ docker_daemon_config | to_nice_json }}\n"
  notify: Restart docker
