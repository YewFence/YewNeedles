name: volguard-volume-copy

services:
  copy:
    build:
      context: .
      dockerfile: Dockerfile
    image: volguard-volume-copy:local
    init: true
    labels:
      dev.volguard.tool: volume-copy
      dev.volguard.volume-copy: "true"
    environment:
      COPY_DELETE: ${COPY_DELETE:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - type: ${SOURCE_MOUNT_TYPE:?set SOURCE_MOUNT_TYPE}
        source: ${SOURCE_MOUNT_SOURCE:?set SOURCE_MOUNT_SOURCE}
        target: /source
        read_only: true
      - type: ${TARGET_MOUNT_TYPE:?set TARGET_MOUNT_TYPE}
        source: ${TARGET_MOUNT_SOURCE:?set TARGET_MOUNT_SOURCE}
        target: /target
    security_opt:
      - no-new-privileges:true

volumes:
  source-volume:
    external: ${SOURCE_VOLUME_EXTERNAL:-false}
    name: ${SOURCE_VOLUME_NAME:-volguard-volume-copy-unused-source}
  target-volume:
    external: ${TARGET_VOLUME_EXTERNAL:-false}
    name: ${TARGET_VOLUME_NAME:-volguard-volume-copy-unused-target}
