name: volguard-volume-sftp

services:
  sftp:
    build:
      context: .
      dockerfile: Dockerfile
    image: volguard-volume-sftp:local
    init: true
    labels:
      dev.volguard.tool: volume-sftp
      dev.volguard.volume-sftp: "true"
    environment:
      SFTP_BIND_ADDRESS: ${SFTP_BIND_ADDRESS:-127.0.0.1}
      SFTP_PORT: ${SFTP_PORT:-2222}
      SFTP_USER: ${SFTP_USER:-volguard}
      SFTP_UID: ${SFTP_UID:-1000}
      SFTP_GID: ${SFTP_GID:-1000}
      SFTP_MAX_AUTH_TRIES: ${SFTP_MAX_AUTH_TRIES:-6}
      SFTP_ALLOW_ROOT_LOGIN: ${SFTP_ALLOW_ROOT_LOGIN:-false}
      SFTP_AUTHORIZED_KEY_PATH: /run/volguard/authorized_key.pub
      TZ: ${TZ:-UTC}
    ports:
      - "${SFTP_BIND_ADDRESS:-127.0.0.1}:${SFTP_PORT:-2222}:22"
    volumes:
      - type: bind
        source: ${SFTP_AUTHORIZED_KEY_FILE:-${HOME}/.ssh/authorized_keys}
        target: /run/volguard/authorized_key.pub
        read_only: true
      - type: volume
        source: target-volume
        target: /home/${SFTP_USER:-volguard}/volume
        read_only: ${VOLUME_READ_ONLY:-true}
    security_opt:
      - no-new-privileges:true

volumes:
  target-volume:
    name: ${VOLUME_NAME:?set VOLUME_NAME}
    external: true
