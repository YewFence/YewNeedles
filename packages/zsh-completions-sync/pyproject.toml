[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zsh-completions-sync"
version = "0.1.0"
description = "Synchronize zsh completion scripts into global and project-local completion directories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zsh-completions-sync = "zsh_completions_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zsh_completions_sync"]

[tool.hatch.build.targets.wheel.force-include]
"src/zsh_completions_sync/registry.toml" = "zsh_completions_sync/registry.toml"
