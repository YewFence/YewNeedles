[tools]
gh = "latest"
python = "latest"
uv = "latest"

[tasks."agent-init"]
description = "初始化 mise、Codex、cc-switch 并配置 WebDAV"
file = "mise-tasks/agent-init"

[tasks."fix-x"]
description = "为 mise 安装工具的可执行文件补充 +x 权限"
file = "mise-tasks/fix-x"

[tasks."gh-auth-setup-git-local"]
description = "用 ~/.gitconfig.local 执行 gh auth setup-git 并检查 include 配置"
file = "mise-tasks/gh-auth-setup-git-local"

[tasks."gh-install-latest-rpm"]
description = "在 Fedora/RHEL 系发行版安装 GitHub 最新 release 的 RPM"
file = "mise-tasks/gh-install-latest-rpm"

[tasks."fedora-boot-backup"]
description = "备份 Fedora 笔记本的 /boot 和 /boot/efi"
file = "mise-tasks/fedora-boot-backup"

[tasks."npm-approve-builds"]
description = "批准 npm 工具被 pnpm 跳过的构建脚本并可选重建"
file = "mise-tasks/npm-approve-builds"

[tasks."jjpush"]
description = "将指定 bookmark 指向上一个 change 并执行 jj git push"
file = "mise-tasks/jjpush"

[tasks."rime-ice"]
description = "通过 plum 为 fcitx5-rime 安装雾凇拼音"
file = "mise-tasks/rime-ice"

[tasks."shizuku"]
description = "通过 adb 启动平板的 Shizuku 服务"
file = "mise-tasks/shizuku"

[tasks."ops:shell-volumes"]
description = "打开带有简单工具的 shell 以简单管理指定的 named volume"
run = "./volume-tools/volume-shell/open.sh"

[tasks."ops:sftp-volumes"]
description = "将指定的 named volume 暴露为 sftp 服务"
run = "./volume-tools/volume-sftp/open.sh"

[tasks."ops:copy-volume"]
description = "在宿主机路径和 named volume 之间同步内容"
run = "./volume-tools/volume-copy/open.sh"
